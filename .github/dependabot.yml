version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Metadata patch verification: docs/dependency-maintenance.md.
      next:
        applies-to: version-updates
        patterns:
          - next
          - "@next/*"
          - eslint-config-next
      storybook:
        patterns:
          - storybook
          - "@storybook/*"
          - eslint-plugin-storybook
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - next
          - "@next/*"
          - eslint-config-next
          - storybook
          - "@storybook/*"
          - eslint-plugin-storybook
          - vitest
          - "@vitest/*"
    ignore:
      # Minor/major Next-family upgrades require deliberate patch review.
      - dependency-name: next
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "@next/*"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: "@vitest/*"
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    groups:
      actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
      day: monday
