name: Integration checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Check owns cancellation for PR/main runs. Reusing its concurrency group here
# would cancel the caller because a reusable workflow shares github.workflow.
concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_PRODUCT_IMAGE_BLOB_HOST: publishinge2e.public.blob.vercel-storage.com
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  storybook:
    name: Storybook checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          # Pinned Playwright browsers do not use the image's unrelated Chrome apt feed.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          pnpm exec playwright install --with-deps chromium
      - name: Test component stories
        run: pnpm test:stories
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Upload Storybook failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: storybook-diagnostics
          path: |
            test-results/storybook/
            *storybook.log
          if-no-files-found: ignore
          retention-days: 7

  storefront:
    name: Storefront browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-commerce-test
          POSTGRES_DB: store_catalog_e2e
        ports:
          - 55479:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d store_catalog_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALOG_E2E_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_catalog_e2e
      PUBLISHING_E2E_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_publishing_e2e
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create isolated publishing database
        run: node --input-type=module -e 'import { Pool } from "pg"; const pool = new Pool({connectionString:process.env.CATALOG_E2E_DATABASE_URL}); await pool.query("create database store_publishing_e2e"); await pool.end();'
      - name: Install test browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          pnpm exec playwright install --with-deps chromium webkit
      - name: Build the unconfigured and configured storefront fixtures
        id: storefront-build
        run: pnpm test:e2e:prepare
      - name: Test production pages
        run: pnpm test:e2e
      - name: Upload storefront browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: storefront-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Test enabled publishing through HTTP and browsers
        if: ${{ !cancelled() && steps.storefront-build.outcome == 'success' }}
        run: pnpm test:e2e:publishing
      - name: Build the configured commerce fixture
        if: ${{ !cancelled() && steps.storefront-build.outcome == 'success' }}
        run: pnpm test:commerce:build
      - name: Test essential customer commerce journeys
        if: ${{ !cancelled() && steps.storefront-build.outcome == 'success' }}
        run: pnpm test:e2e:commerce
      - name: Upload commerce browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commerce-browser-diagnostics
          path: |
            playwright-report/commerce/
            test-results/commerce/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload publishing browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publishing-browser-diagnostics
          path: |
            playwright-report/publishing/
            test-results/publishing/
          if-no-files-found: ignore
          retention-days: 7

  admin:
    name: Admin browser checks (signup ${{ matrix.public-signup }})
    strategy:
      fail-fast: false
      matrix:
        public-signup: ["false", "true"]
    env:
      ADMIN_E2E_PUBLIC_SIGNUP: ${{ matrix.public-signup }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          pnpm exec playwright install --with-deps chromium
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        id: setup-supabase
        with:
          version: 2.114.0
      - name: Prepare isolated Supabase Auth
        env:
          # Preserve the CLI's ECR → GHCR → Docker Hub registry fallback sequence.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ""
        run: pnpm test:admin:prepare
      - name: Build with the local admin origin
        run: pnpm test:admin:build
      - name: Test private library and Supabase sign-in
        run: pnpm test:e2e:admin
      - name: Stop isolated Supabase Auth
        if: always() && steps.setup-supabase.outcome == 'success'
        run: supabase stop --workdir .tmp/admin-e2e --no-backup
      - name: Upload admin browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: admin-browser-diagnostics-signup-${{ matrix.public-signup }}
          path: |
            playwright-report/admin/
            test-results/admin/
          if-no-files-found: ignore
          retention-days: 7
