name: Prepare template release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed commit SHA on main (unless unmerged candidate)
        required: true
        type: string
      tag:
        description: Reserved template-vMAJOR.MINOR.PATCH name
        required: true
        type: string

      candidate:
        description: Explicitly allow an unmerged candidate and report PR differences
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'NerdOutInc/ai-shop-template'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - name: Prepare pinned candidate metadata
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CANDIDATE: ${{ inputs.candidate }}
        run: |
          mkdir -p .tmp
          args=()
          if [ "$RELEASE_CANDIDATE" = "true" ]; then args+=(--candidate); fi
          node scripts/template/prepare-template-release.mjs --ref "$RELEASE_COMMIT" --tag "$RELEASE_TAG" "${args[@]}" > .tmp/template-release.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: template-release-candidate
          path: .tmp/template-release.json
          retention-days: 7
