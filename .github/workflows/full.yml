name: Full verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-commerce-test
          POSTGRES_DB: store_commerce_test
        ports:
          - 55479:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d store_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_PRODUCT_IMAGE_BLOB_HOST: publishinge2e.public.blob.vercel-storage.com
      TEMPLATE_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_template_test
      CHECKOUT_CAPACITY_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_capacity_test
      CHECKOUT_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_commerce_test
      ADMIN_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_admin_test
      AGENT_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_agent_test
      DRAFTS_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_drafts_test
      GARMENTS_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_garments_test
      LIBRARY_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_library_test
      CATALOG_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_catalog_test
      PUBLISHING_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_publishing_test
      SUBSCRIBER_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_subscriber_test
      SIGNUP_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_signup_test
      SHIPPING_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_shipping_test
      ORDERS_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_orders_test
      DROP_EMAIL_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_drop_email_test
      DROP_EMAIL_OVERVIEW_TEST_DATABASE_URL: postgresql://postgres:local-commerce-test@localhost:55479/store_drop_email_overview_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: scripts/skills/requirements.txt
      - name: Check migration references
        run: pnpm check:migrations
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install store skill dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/skills/requirements.txt
      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
          psql --version
      - name: Create isolated test databases
        run: node --input-type=module -e 'import { Pool } from "pg"; const pool = new Pool({connectionString:process.env.CHECKOUT_TEST_DATABASE_URL}); for (const database of ["store_capacity_test", "store_template_test", "store_catalog_test", "store_publishing_test", "store_admin_test", "store_library_test", "store_agent_test", "store_drafts_test", "store_garments_test", "store_signup_test", "store_subscriber_test", "store_orders_test", "store_shipping_test", "store_drop_email_test", "store_drop_email_overview_test"]) await pool.query("create database " + database); await pool.end();'
      - name: Check repository structure
        run: pnpm check:structure
      - name: Protect merged migration history
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: pnpm check:migration-history
      - name: Lint
        run: pnpm lint
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Check formatting
        run: pnpm format:check
      - name: Test CI contracts
        run: pnpm test:ci
      - name: Test unit behavior
        run: pnpm test:unit
      - name: Test fresh template database and runtime permissions
        env:
          SUPABASE_PRIVILEGES_TEST: "true"
        run: pnpm test:database
      - name: Test generated brand assets
        run: pnpm test:branding
      - name: Test architecture rules
        run: pnpm test:architecture
      - name: Test dependency patch upgrades
        run: pnpm test:dependencies
      - name: Test publishing notifications
        run: pnpm test:monitor
      - name: Test store skill scripts
        run: pnpm test:skills
      - name: Test template setup and hygiene
        run: pnpm test:template
      - name: Test reusable artwork tools
        run: pnpm test:artwork
      - name: Test design-agent CLI
        run: pnpm test:design-agent
      - name: Verify template portability
        run: pnpm check:template
      - name: Build the merchant storefront
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: pnpm build

  integration:
    name: Integration checks
    needs: check
    uses: ./.github/workflows/integration.yml

  required:
    name: Full verification
    if: always()
    needs: [check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every suite to succeed
        env:
          FOUNDATION_RESULT: ${{ needs.check.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          printf 'Foundation checks: %s\nIntegration checks: %s\n' "$FOUNDATION_RESULT" "$INTEGRATION_RESULT"
          if [[ "$FOUNDATION_RESULT" != "success" || "$INTEGRATION_RESULT" != "success" ]]; then
            echo '::error::All foundation, Storybook, storefront, publishing, and admin suites must pass. Open the failed job for its logs and diagnostics.'
            exit 1
          fi
