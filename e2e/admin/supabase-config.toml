project_id = "store-admin-e2e"

[api]
enabled = true
port = 58831
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 58832
shadow_port = 58830
major_version = 17

[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 58834
smtp_port = 58835
pop3_port = 58836

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3300"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
# This enables the email provider; global auth.enable_signup still blocks registration.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Local library sign-in code"
content_path = "./supabase/email-code.html"

[auth.email.template.confirmation]
subject = "Local library verification code"
content_path = "./supabase/email-code.html"

[auth.email.template.invite]
subject = "Local owner invitation code"
content_path = "./supabase/email-code.html"

[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Your Store local tests"
rp_id = "localhost"
rp_origins = ["http://localhost:3300"]

[auth.rate_limit]
email_sent = 100
token_verifications = 100
sign_in_sign_ups = 100

[analytics]
enabled = false

[edge_runtime]
enabled = false
